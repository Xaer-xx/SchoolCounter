<h1>☀️ Odpočet do Letných prázdnin ⛱️</h1>
<p class="subtitle">Do Letných prázdnin ostáva len:</p>

<div class="countdown" id="countdown">
  <div class="box"><div class="value" id="months">0</div><div class="label">Mesiace</div></div>
  <div class="box"><div class="value" id="weeks">0</div><div class="label">Týždne</div></div>
  <div class="box"><div class="value" id="days">0</div><div class="label">Dni</div></div>
  <div class="box"><div class="value" id="hours">00</div><div class="label">Hodiny</div></div>
  <div class="box"><div class="value" id="minutes">00</div><div class="label">Minúty</div></div>
  <div class="box"><div class="value" id="seconds">00</div><div class="label">Sekundy</div></div>
</div>

<div class="message" id="message">☀️ Prázdniny sú tu! ⛱️</div>
